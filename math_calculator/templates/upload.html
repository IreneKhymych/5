<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <title>Завантажити файли</title>
</head>
<body>
    <h1>Завантаження файлів</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color: red;">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('upload_file') }}" enctype="multipart/form-data">
        <label for="taskfile">Файл завдання (.json або .xml):</label><br>
        <input type="file" id="taskfile" name="taskfile" accept=".json,.xml" required><br><br>

        <label for="datafile">Файл даних:</label><br>
        <input type="file" id="datafile" name="datafile" required><br><br>

        <button type="submit">Відправити</button>
    </form>
</body>
</html>
